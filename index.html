<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F6F4F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="語音記帳" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="支援智慧整句語音辨識的信用卡消費記帳工具，自動拆解日期、消費地點、項目與金額。" />
  <title>語音刷卡記帳 — 智慧信用卡消費明細</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='30' fill='%230F766E'/%3E%3Crect x='22' y='34' width='76' height='52' rx='9' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='22' y1='52' x2='98' y2='52' stroke='white' stroke-width='7'/%3E%3Ccircle cx='82' cy='70' r='6' fill='%23FBBF24'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='30' fill='%230F766E'/%3E%3Crect x='22' y='34' width='76' height='52' rx='9' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='22' y1='52' x2='98' y2='52' stroke='white' stroke-width='7'/%3E%3Ccircle cx='82' cy='70' r='6' fill='%23FBBF24'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      const manifest = {
        name: "語音刷卡記帳",
        short_name: "語音記帳",
        start_url: "./",
        display: "standalone",
        background_color: "#F6F4F0",
        theme_color: "#0F766E",
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='30' fill='%230F766E'/%3E%3Crect x='22' y='34' width='76' height='52' rx='9' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='22' y1='52' x2='98' y2='52' stroke='white' stroke-width='7'/%3E%3Ccircle cx='82' cy='70' r='6' fill='%23FBBF24'/%3E%3C/svg%3E",
          sizes: "192x192 512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-canvas: #F5F2EB;
      --bg-surface: #FFFFFF;
      --bg-subtle: #FAF8F4;
      --bg-pill: #EFECE6;
      --ink-primary: #1C1917;
      --ink-secondary: #57534E;
      --ink-muted: #8A847C;
      --border-soft: #E6E1D8;
      --border-strong: #D5CFC4;
      --accent: #0F766E;
      --accent-hover: #115E59;
      --accent-soft: #ECFDF5;
      --accent-ring: rgba(15, 118, 110, 0.14);
      --danger: #E11D48;
      --danger-soft: #FFF1F2;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(15, 118, 110, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 0%, rgba(217, 119, 6, 0.05) 0%, transparent 40%);
      color: var(--ink-primary);
    }

    .font-num {
      font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
      font-variant-numeric: tabular-nums;
    }

    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      box-shadow:
        0 12px 32px -10px rgba(28, 25, 23, 0.06),
        0 2px 6px -1px rgba(28, 25, 23, 0.03);
    }

    /* Tactile Large Circular Mic Button */
    .mic-orb {
      width: 116px;
      height: 116px;
      border-radius: 9999px;
      background: linear-gradient(145deg, #14867D 0%, #0F766E 55%, #0B5C56 100%);
      color: #FFFFFF;
      box-shadow:
        0 14px 28px -6px rgba(15, 118, 110, 0.38),
        0 0 0 8px rgba(15, 118, 110, 0.10),
        inset 0 2px 3px rgba(255, 255, 255, 0.32);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mic-orb:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 18px 32px -6px rgba(15, 118, 110, 0.44),
        0 0 0 10px rgba(15, 118, 110, 0.13),
        inset 0 2px 3px rgba(255, 255, 255, 0.38);
    }

    .mic-orb:active {
      transform: translateY(1px) scale(0.96);
    }

    .mic-orb.recording-state {
      background: linear-gradient(145deg, #F43F5E 0%, #E11D48 60%, #BE123C 100%);
      box-shadow:
        0 14px 28px -6px rgba(225, 29, 72, 0.42),
        0 0 0 8px rgba(225, 29, 72, 0.14),
        inset 0 2px 3px rgba(255, 255, 255, 0.35);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.96); opacity: 0.85; }
      75% { transform: scale(1.32); opacity: 0; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    @keyframes pulse-ring-outer {
      0% { transform: scale(1); opacity: 0.45; }
      75% { transform: scale(1.52); opacity: 0; }
      100% { transform: scale(1.52); opacity: 0; }
    }

    .recording-state::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      border: 2.5px solid #F43F5E;
      animation: pulse-ring 1.3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      pointer-events: none;
    }

    .recording-state::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 9999px;
      border: 2px solid rgba(244, 63, 94, 0.4);
      animation: pulse-ring-outer 1.3s cubic-bezier(0.215, 0.61, 0.355, 1) 0.2s infinite;
      pointer-events: none;
    }

    @keyframes wave {
      0%, 100% { height: 5px; }
      50% { height: 18px; }
    }

    .wave-bar {
      width: 3.5px;
      background-color: #E11D48;
      border-radius: 9999px;
      animation: wave 0.75s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }

    @keyframes field-flash {
      0% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.45); background-color: #ECFDF5; }
      60% { box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.22); background-color: #ECFDF5; }
      100% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0); }
    }

    .flash-highlight {
      animation: field-flash 0.95s ease-out;
    }

    .field-input {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      color: var(--ink-primary);
      transition: all 0.18s ease;
    }

    .field-input:focus {
      background-color: #FFFFFF;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
      outline: none;
    }
  </style>
</head>
<body class="antialiased py-4 px-3 sm:py-8 sm:px-6 min-h-screen">
  <main class="max-w-2xl mx-auto space-y-4">

    <!-- Main Container Card -->
    <div class="surface-card rounded-3xl p-4 sm:p-7 space-y-5">

      <!-- Header Bar -->
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-[#0F766E] text-white flex items-center justify-center shadow-sm shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2.5" />
              <line x1="2" y1="10" x2="22" y2="10" />
            </svg>
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-[#1C1917]">語音刷卡記帳</h1>
            <p class="text-xs text-[#8A847C]">開口說一聲，自動記錄每筆信用卡消費</p>
          </div>
        </div>

        <!-- Segmented Navigation & CSV Export -->
        <div class="flex items-center gap-2">
          <div class="inline-flex p-1 rounded-2xl bg-[#EFECE6] border border-[#E6E1D8]">
            <button id="tabBtnEntry" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white text-[#1C1917] shadow-xs transition cursor-pointer">
              語音記帳
            </button>
            <button id="tabBtnList" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-medium text-[#57534E] hover:text-[#1C1917] transition cursor-pointer">
              消費明細 (<span id="tabCountBadge" class="font-num">0</span>)
            </button>
          </div>
          <button id="exportCsvBtn" type="button" title="預覽與匯出 CSV 對帳單" class="px-3 py-2 rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4] hover:bg-[#EFECE6] text-xs font-semibold text-[#57534E] transition cursor-pointer">
            匯出 CSV
          </button>
        </div>
      </header>

      <!-- Summary Metrics Strip -->
      <section class="grid grid-cols-2 gap-3">
        <div class="rounded-2xl bg-[#FAF8F4] border border-[#E6E1D8] px-4 py-3 flex flex-col justify-between">
          <span class="text-xs font-medium text-[#8A847C]">今日刷卡消費</span>
          <div class="mt-1 flex items-baseline justify-between gap-2">
            <span id="todayTotal" class="font-num text-lg sm:text-xl font-bold text-[#1C1917]">NT$ 0</span>
            <span class="text-[11px] font-medium text-[#8A847C]">Today</span>
          </div>
        </div>
        <div class="rounded-2xl bg-[#ECFDF5]/75 border border-[#A7F3D0] px-4 py-3 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-[#0F766E]">累計消費總額</span>
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white/90 text-[#0F766E] border border-[#A7F3D0]/60"><span id="totalCount" class="font-num">0</span> 筆紀錄</span>
          </div>
          <div class="mt-1">
            <span id="grandTotal" class="font-num text-lg sm:text-xl font-bold text-[#0F766E]">NT$ 0</span>
          </div>
        </div>
      </section>

      <!-- Global Warning / Status Banner -->
      <div id="statusBanner" class="hidden rounded-2xl px-4 py-3 text-xs font-medium border border-amber-300 bg-amber-50/90 text-amber-950 flex items-start justify-between gap-3">
        <span id="statusBannerText" class="leading-relaxed"></span>
        <button id="statusBannerClose" type="button" class="text-xs font-semibold underline opacity-80 hover:opacity-100 cursor-pointer shrink-0">關閉</button>
      </div>

      <!-- CSV Modal / Drawer -->
      <div id="csvPreviewBox" class="hidden rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4] p-4 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-[#1C1917]">CSV 對帳單預覽</span>
          <div class="flex items-center gap-2">
            <button id="copyCsvBtn" type="button" class="px-3 py-1.5 rounded-xl bg-[#0F766E] text-white text-xs font-semibold cursor-pointer hover:bg-[#115E59] transition">
              複製 CSV
            </button>
            <button id="closeCsvBtn" type="button" class="px-2.5 py-1.5 rounded-xl border border-[#E6E1D8] bg-white text-xs text-[#57534E] cursor-pointer">
              收起
            </button>
          </div>
        </div>
        <textarea id="csvTextarea" readonly rows="4" class="w-full rounded-xl border border-[#E6E1D8] bg-white p-3 text-xs font-mono text-[#1C1917] focus:outline-none"></textarea>
      </div>

      <!-- TAB 1: Voice Studio + 4-Field Form -->
      <div id="viewEntry" class="space-y-5">

        <!-- Voice Input Studio Card -->
        <div class="rounded-3xl border border-[#E6E1D8] bg-gradient-to-b from-[#FAF8F4] to-[#F3EFE8]/70 p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2">
              <span class="inline-block w-2 h-2 rounded-full bg-[#0F766E]"></span>
              <span class="text-xs sm:text-sm font-bold text-[#1C1917]">智慧整句語音輸入</span>
              <span id="formStatusToast" class="text-xs px-2.5 py-0.5 rounded-full bg-[#0F766E] text-white font-semibold hidden">已帶入結果</span>
            </div>

            <button
              id="demoVoiceBtn"
              type="button"
              class="px-3 py-1.5 rounded-full border border-[#D5CFC4] bg-white hover:bg-[#FAF8F4] active:scale-95 text-xs font-semibold text-[#57534E] transition flex items-center gap-1.5 cursor-pointer shadow-2xs"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#0F766E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              模擬語音示範
            </button>
          </div>

          <!-- Centerpiece Large Circular Voice Button -->
          <div class="flex flex-col items-center justify-center py-3">
            <button
              id="mainMicBtn"
              type="button"
              aria-label="語音輸入按鈕"
              class="mic-orb relative flex flex-col items-center justify-center gap-1.5 cursor-pointer select-none"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
              </svg>
              <span id="mainMicLabel" class="text-xs sm:text-sm font-bold tracking-wide">點擊說話</span>
            </button>
            <p class="mt-3.5 text-xs text-[#57534E] text-center">
              試著說：<span class="font-semibold text-[#1C1917]">「今天在星巴克買拿鐵 155 元」</span>
            </p>
          </div>

          <!-- Live Transcript & Custom Sentence Test Box -->
          <div id="voiceFeedbackBox" class="rounded-2xl bg-white/90 border border-[#E6E1D8] p-3.5 space-y-2.5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2 min-w-0">
                <div id="waveContainer" class="hidden items-center gap-1 h-5 px-1 shrink-0">
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                </div>
                <p id="transcriptText" class="text-xs font-semibold text-[#1C1917]">
                  準備就緒：點擊上方圓形麥克風按鈕即可開始說話
                </p>
              </div>
              <label class="flex items-center gap-1.5 text-xs text-[#57534E] shrink-0 cursor-pointer select-none">
                <input id="autoSaveToggle" type="checkbox" checked class="accent-[#0F766E] rounded cursor-pointer" />
                <span>辨識後自動存入</span>
              </label>
            </div>

            <!-- Interactive Spoken Sentence Tester -->
            <div class="flex items-center gap-2 pt-1">
              <input
                id="customVoiceInput"
                type="text"
                placeholder="或手動輸入語句測試解析：例如「昨天在全聯買牛奶 185 元」"
                class="field-input flex-1 rounded-xl px-3 py-2 text-xs placeholder:text-[#8A847C]"
              />
              <button
                id="runCustomVoiceBtn"
                type="button"
                class="px-3 py-2 rounded-xl bg-[#EFECE6] hover:bg-[#E5E0D5] text-[#1C1917] text-xs font-semibold active:scale-95 transition cursor-pointer shrink-0"
              >
                測試解析
              </button>
            </div>
            <p id="parseHintText" class="text-xs text-[#0F766E] font-medium empty:hidden"></p>
          </div>
        </div>

        <!-- 4-Field Expense Form -->
        <form id="expenseForm" class="space-y-4">
          <input type="hidden" id="editingId" value="" />
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- 1. Date -->
            <div class="rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4]/60 p-3">
              <div class="flex items-center justify-between mb-1.5 min-h-[30px]">
                <label for="dateInput" class="text-xs font-semibold text-[#57534E]">1. 消費日期</label>
                <span class="text-[11px] text-[#8A847C]">自動帶入今日</span>
              </div>
              <input
                id="dateInput"
                type="date"
                required
                class="field-input w-full rounded-xl px-3 py-2 text-sm font-medium"
              />
            </div>

            <!-- 2. Location -->
            <div class="rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4]/60 p-3">
              <div class="flex items-center justify-between mb-1.5 min-h-[30px]">
                <label for="locationInput" class="text-xs font-semibold text-[#57534E]">2. 消費地點 / 商店</label>
                <button type="button" data-field="location" title="單獨語音輸入消費地點" class="field-mic-btn w-8 h-8 rounded-full bg-[#ECFDF5] text-[#0F766E] border border-[#A7F3D0] hover:bg-[#0F766E] hover:text-white active:scale-95 transition flex items-center justify-center cursor-pointer shadow-2xs">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                  </svg>
                </button>
              </div>
              <input
                id="locationInput"
                type="text"
                required
                placeholder="例如：星巴克、全聯、好市多"
                class="field-input w-full rounded-xl px-3 py-2 text-sm placeholder:text-[#8A847C]"
              />
            </div>

            <!-- 3. Item -->
            <div class="rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4]/60 p-3">
              <div class="flex items-center justify-between mb-1.5 min-h-[30px]">
                <label for="itemInput" class="text-xs font-semibold text-[#57534E]">3. 消費項目 / 明細</label>
                <button type="button" data-field="item" title="單獨語音輸入消費項目" class="field-mic-btn w-8 h-8 rounded-full bg-[#ECFDF5] text-[#0F766E] border border-[#A7F3D0] hover:bg-[#0F766E] hover:text-white active:scale-95 transition flex items-center justify-center cursor-pointer shadow-2xs">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                  </svg>
                </button>
              </div>
              <input
                id="itemInput"
                type="text"
                required
                placeholder="例如：冰拿鐵、家庭日用品"
                class="field-input w-full rounded-xl px-3 py-2 text-sm placeholder:text-[#8A847C]"
              />
            </div>

            <!-- 4. Amount -->
            <div class="rounded-2xl border border-[#E6E1D8] bg-[#FAF8F4]/60 p-3">
              <div class="flex items-center justify-between mb-1.5 min-h-[30px]">
                <label for="amountInput" class="text-xs font-semibold text-[#57534E]">4. 刷卡金額 (NT$)</label>
                <button type="button" data-field="amount" title="單獨語音輸入金額" class="field-mic-btn w-8 h-8 rounded-full bg-[#ECFDF5] text-[#0F766E] border border-[#A7F3D0] hover:bg-[#0F766E] hover:text-white active:scale-95 transition flex items-center justify-center cursor-pointer shadow-2xs">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                  </svg>
                </button>
              </div>
              <input
                id="amountInput"
                type="number"
                min="1"
                step="1"
                required
                placeholder="185"
                class="field-input font-num w-full rounded-xl px-3 py-2 text-sm font-bold placeholder:text-[#8A847C]"
              />
            </div>
          </div>

          <!-- Quick Merchant Chips + Submit Button -->

  <script>
    const STORAGE_KEY = 'cc_voice_records_v1';

    function getTodayStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const INITIAL_RECORDS = [

      { id: 'rec-2', date: getTodayStr(0), location: '全聯福利中心', item: '鮮奶與家庭日用品', amount: 680 },
      { id: 'rec-3', date: getTodayStr(-1), location: '台灣中油', item: '汽車加油 95 無鉛', amount: 1150 }

    let records = [];
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      records = saved ? JSON.parse(saved) : INITIAL_RECORDS;

    const tabBtnEntry = document.getElementById('tabBtnEntry');

    const statusBanner = document.getElementById('statusBanner');
    const statusBannerText = document.getElementById('statusBannerText');
    const statusBannerClose = document.getElementById('statusBannerClose');

    const csvPreviewBox = document.getElementById('csvPreviewBox');
    const csvTextarea = document.getElementById('csvTextarea');
    const copyCsvBtn = document.getElementById('copyCsvBtn');
    const closeCsvBtn = document.getElementById('closeCsvBtn');

    const todayTotalEl = document.getElementById('todayTotal');
    const grandTotalEl = document.getElementById('grandTotal');
    const totalCountEl = document.getElementById('totalCount');
    const recordsTableBody = document.getElementById('recordsTableBody');
    const emptyState = document.getElementById('emptyState');

    const filterDateInput = document.getElementById('filterDateInput');
    const clearFilterBtn = document.getElementById('clearFilterBtn');
    const searchInput = document.getElementById('searchInput');
    const exportCsvBtn = document.getElementById('exportCsvBtn');

    const mainMicBtn = document.getElementById('mainMicBtn');
    const mainMicLabel = document.getElementById('mainMicLabel');
    const demoVoiceBtn = document.getElementById('demoVoiceBtn');
    const waveContainer = document.getElementById('waveContainer');
    const transcriptText = document.getElementById('transcriptText');
    const parseHintText = document.getElementById('parseHintText');
    const autoSaveToggle = document.getElementById('autoSaveToggle');
    const customVoiceInput = document.getElementById('customVoiceInput');
    const runCustomVoiceBtn = document.getElementById('runCustomVoiceBtn');

    dateInput.value = getTodayStr(0);

    function flashElement(el) {
      if (!el) return;
      el.classList.remove('flash-highlight');
      void el.offsetWidth;
      el.classList.add('flash-highlight');
    }

    function showBanner(msg) {
      statusBannerText.textContent = msg;
      statusBanner.classList.remove('hidden');
    }

    statusBannerClose.addEventListener('click', () => {
      statusBanner.classList.add('hidden');
    });

    let toastTimer = null;
    function showToast(msg) {
      formStatusToast.textContent = msg;
      formStatusToast.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        formStatusToast.classList.add('hidden');
      }, 3000);
    }

    function switchTab(tab) {
      if (tab === 'entry') {
        viewEntry.classList.remove('hidden');
        viewList.classList.add('hidden');
        tabBtnEntry.className = 'px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white text-[#1C1917] shadow-xs transition cursor-pointer';
        tabBtnList.className = 'px-3.5 py-1.5 rounded-xl text-xs font-medium text-[#57534E] hover:text-[#1C1917] transition cursor-pointer';
      } else {
        viewEntry.classList.add('hidden');
        viewList.classList.remove('hidden');
        tabBtnList.className = 'px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white text-[#1C1917] shadow-xs transition cursor-pointer';
        tabBtnEntry.className = 'px-3.5 py-1.5 rounded-xl text-xs font-medium text-[#57534E] hover:text-[#1C1917] transition cursor-pointer';
      }
    }

    tabBtnEntry.addEventListener('click', () => switchTab('entry'));
    tabBtnList.addEventListener('click', () => switchTab('list'));
    viewAllLink.addEventListener('click', () => switchTab('list'));

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {}
    }

    function parseChineseNumber(str) {
      if (!str) return null;
      const directMatch = str.replace(/,/g, '').match(/\d+/);
      if (directMatch) return parseInt(directMatch[0], 10);
      const map = { '零':0, '一':1, '二':2, '兩':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 };
      const units = { '十':10, '百':100, '千':1000, '萬':10000 };
      let total = 0, current = 0, matched = false;
      for (const ch of str) {
        if (map[ch] !== undefined) { current = map[ch]; matched = true; }
        else if (units[ch] !== undefined) {
          matched = true;
          if (current === 0) current = 1;
          total += current * units[ch];
          current = 0;
        }
      }
      total += current;
      return matched && total > 0 ? total : null;
    }

    function parseSpokenExpense(rawText) {
      let text = rawText.trim().replace(/[。，、！？]/g, ' ');
      const result = { date: getTodayStr(0), location: '', item: '', amount: null };

      if (text.includes('前天')) {
        result.date = getTodayStr(-2);
        text = text.replace(/前天/g, ' ');
      } else if (text.includes('昨天') || text.includes('昨日')) {
        result.date = getTodayStr(-1);
        text = text.replace(/昨天|昨日/g, ' ');
      } else if (text.includes('今天') || text.includes('今日')) {
        result.date = getTodayStr(0);
        text = text.replace(/今天|今日/g, ' ');
      } else {
        const mdMatch = text.match(/(\d{1,2})\s*[月\/\-]\s*(\d{1,2})\s*[日號]?/);
        if (mdMatch) {
          const year = new Date().getFullYear();
          result.date = `${year}-${String(mdMatch[1]).padStart(2, '0')}-${String(mdMatch[2]).padStart(2, '0')}`;
          text = text.replace(mdMatch[0], ' ');
        }
      }

      const allNumbers = [...text.matchAll(/(\d[\d,]*)\s*(?:元|塊錢|塊|台幣)?/g)];
      if (allNumbers.length > 0) {
        const lastMatch = allNumbers[allNumbers.length - 1];
        result.amount = parseInt(lastMatch[1].replace(/,/g, ''), 10);
        const idx = lastMatch.index;
        text = text.slice(0, idx) + ' ' + text.slice(idx + lastMatch[0].length);
      } else {
        const cnAmount = parseChineseNumber(text);
        if (cnAmount) result.amount = cnAmount;
      }

      text = text.replace(/花了|消費了|刷卡|刷了|一共|總共|台幣|塊錢|元整|塊|元/g, ' ').trim();

      const patternA = /(?:在|去|到)\s*([^\s]+?)\s*(?:買了|買|吃了|吃|喝了|喝|點了|點|訂了|訂|刷了|加了|消費)\s*(.+)/;
      const matchA = text.match(patternA);
      if (matchA) {
        result.location = matchA[1].trim();
        result.item = matchA[2].trim();
        return result;
      }

      const patternB = /^([^\s]+?)\s*(?:買了|買|吃了|吃|喝了|喝|點了|點|訂了|訂)\s*(.+)/;
      const matchB = text.match(patternB);
      if (matchB) {
        result.location = matchB[1].trim();
        result.item = matchB[2].trim();
        return result;
      }

      const tokens = text.split(/\s+/).filter(Boolean);
      if (tokens.length >= 2) {
        result.location = tokens[0].replace(/^(在|去|到)/, '');
        result.item = tokens.slice(1).join(' ');
      } else if (tokens.length === 1) {
        result.location = tokens[0].replace(/^(在|去|到)/, '');
      }
      return result;
    }

    function applyParsedExpense(rawSpeech) {
      const parsed = parseSpokenExpense(rawSpeech);
      if (parsed.date) { dateInput.value = parsed.date; flashElement(dateInput); }
      if (parsed.location) { locationInput.value = parsed.location; flashElement(locationInput); }
      if (parsed.item) { itemInput.value = parsed.item; flashElement(itemInput); }
      if (parsed.amount !== null && !isNaN(parsed.amount)) { amountInput.value = parsed.amount; flashElement(amountInput); }

      parseHintText.textContent = `✓ 解析結果：${parsed.date} ｜ ${parsed.location || '待補充地點'} ｜ ${parsed.item || '待補充項目'} ｜ ${parsed.amount ? 'NT$ ' + parsed.amount : '待補充金額'}`;

      if (autoSaveToggle.checked && parsed.location && parsed.item && parsed.amount && !editingIdInput.value) {
        saveFormRecord(true);
        showToast('已語音辨識並自動存入！');
      } else {
        showToast('已帶入語音辨識欄位！');
      }
    }

    const DEMO_PHRASES = [
      '今天在星巴克買冰拿鐵與可頌花了 235 元',
      '今天在好市多買牛排與鮮奶一共 1680 元',
      '昨天在全聯買家庭日用品 540 塊',
      '今天在 Uber Eats 點健康餐盒 210 元'
    ];
    let demoIdx = 0;

    function runDemoVoice() {
      const phrase = DEMO_PHRASES[demoIdx % DEMO_PHRASES.length];
      demoIdx++;
      waveContainer.classList.remove('hidden');
      waveContainer.classList.add('flex');
      transcriptText.textContent = `模擬語音輸入中：「${phrase}」...`;
      parseHintText.textContent = '正在示範將整句語音拆解為 4 個欄位...';

      setTimeout(() => {
        waveContainer.classList.add('hidden');
        waveContainer.classList.remove('flex');
        transcriptText.textContent = `模擬辨識完成：「${phrase}」`;
        applyParsedExpense(phrase);
      }, 600);
    }

    demoVoiceBtn.addEventListener('click', runDemoVoice);

    // Real Microphone Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let manualStopRequested = false;
    let activeTargetField = 'full';
    let finalBuffer = '';
    let latestCombinedSpeech = '';
    let silenceTimer = null;

    function clearSilenceTimer() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
    }

    function updateMicUiListening(listening) {
      if (listening) {
        waveContainer.classList.remove('hidden');
        waveContainer.classList.add('flex');
        mainMicBtn.classList.add('recording-state');
        mainMicLabel.textContent = '點擊完成';
      } else {
        waveContainer.classList.add('hidden');
        waveContainer.classList.remove('flex');
        mainMicBtn.classList.remove('recording-state');
        mainMicLabel.textContent = '點擊說話';
      }
    }

    function finalizeSpeechSession() {
      clearSilenceTimer();
      manualStopRequested = true;
      isListening = false;
      try { if (recognition) recognition.stop(); } catch (e) {}
      updateMicUiListening(false);

      const spoken = latestCombinedSpeech.trim();
      if (!spoken) {
        transcriptText.textContent = '尚未偵測到語音內容，請再點一次上方「點擊說話」圓鈕重試。';
        return;
      }

      transcriptText.textContent = `辨識完成：「${spoken}」`;
      if (activeTargetField === 'full') {
        applyParsedExpense(spoken);
      } else if (activeTargetField === 'location') {
        locationInput.value = spoken.replace(/[。，、]/g, '').trim();
        flashElement(locationInput);
        showToast(`已填入消費地點：${locationInput.value}`);
      } else if (activeTargetField === 'item') {
        itemInput.value = spoken.replace(/[。，、]/g, '').trim();
        flashElement(itemInput);
        showToast(`已填入消費項目：${itemInput.value}`);
      } else if (activeTargetField === 'amount') {
        const num = parseChineseNumber(spoken);
        if (num) {
          amountInput.value = num;
          flashElement(amountInput);
          showToast(`已填入金額：NT$ ${num}`);
        }
      }
    }

    if (SpeechRecognition) {
      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
          isListening = true;
          statusBanner.classList.add('hidden');
          updateMicUiListening(true);
          if (!latestCombinedSpeech) {
            if (activeTargetField === 'full') {
              transcriptText.textContent = '🎙️ 麥克風持續聆聽中... 請開始說話（說完可點紅色大圓鈕或停頓 3 秒自動完成）';
            } else {
              const names = { location: '消費地點', item: '消費項目', amount: '金額' };
              transcriptText.textContent = `🎙️ 正在聆聽【${names[activeTargetField]}】... 請開始說話`;
            }
          }
        };

        recognition.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const txt = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalBuffer += txt;
            } else {
              interim += txt;
            }
          }
          latestCombinedSpeech = (finalBuffer + interim).trim();
          if (latestCombinedSpeech) {
            transcriptText.textContent = `🎙️ 正在聽您說：「${latestCombinedSpeech}」...`;
            parseHintText.textContent = '繼續說話，或停頓 3 秒自動完成（也可直接點紅色大圓鈕完成）';

            clearSilenceTimer();
            silenceTimer = setTimeout(() => {
              if (isListening && latestCombinedSpeech.trim().length > 0) {
                finalizeSpeechSession();
              }
            }, 3000);
          }
        };

        recognition.onerror = (event) => {
          const err = event && event.error ? event.error : '';
          if (err === 'no-speech') {
            return;
          }
          if (err === 'not-allowed' || err === 'service-not-allowed') {
            clearSilenceTimer();
            manualStopRequested = true;
            isListening = false;
            updateMicUiListening(false);
            transcriptText.textContent = '⚠️ 無法啟動實體麥克風（權限被瀏覽器或預覽視窗攔截）';
            showBanner('⚠️ 目前視窗無法取得麥克風權限。請確認瀏覽器已允許麥克風權限，或點擊「模擬語音示範」測試。');
          }
        };

        recognition.onend = () => {
          if (isListening && !manualStopRequested) {
            try {
              recognition.start();
              return;
            } catch (e) {}
          }
          isListening = false;
          updateMicUiListening(false);
        };
      } catch (e) {
        recognition = null;
      }
    }

    function startRealVoiceCapture(targetField) {
      if (!recognition) {
        showBanner('⚠️ 您的瀏覽器不支援 Web Speech API 語音辨識（建議使用 Chrome、Edge 或 Safari 開啟），或點選「模擬語音示範」體驗。');
        return;
      }
      if (isListening) {
        finalizeSpeechSession();
        return;
      }
      activeTargetField = targetField;
      finalBuffer = '';
      latestCombinedSpeech = '';
      manualStopRequested = false;
      clearSilenceTimer();
      parseHintText.textContent = '';
      try {
        recognition.start();
      } catch (e) {
        try {
          recognition.stop();
        } catch (err) {}
      }
    }

    mainMicBtn.addEventListener('click', () => {
      startRealVoiceCapture('full');
    });

    document.querySelectorAll('.field-mic-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const field = btn.getAttribute('data-field');
        startRealVoiceCapture(field);
      });
    });

    runCustomVoiceBtn.addEventListener('click', () => {
      const customTxt = customVoiceInput.value.trim();
      if (!customTxt) {
        const sample = '昨天在全聯買鮮奶與雞蛋 265 元';
        customVoiceInput.value = sample;
        transcriptText.textContent = `測試口述：「${sample}」`;
        applyParsedExpense(sample);
        return;
      }
      transcriptText.textContent = `測試口述：「${customTxt}」`;
      applyParsedExpense(customTxt);
    });

    customVoiceInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runCustomVoiceBtn.click();
      }
    });

    document.querySelectorAll('.quick-loc-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        locationInput.value = chip.getAttribute('data-quick-loc');
        flashElement(locationInput);
        itemInput.focus();
        showToast(`已選擇地點：${locationInput.value}`);
      });
    });

    function saveFormRecord(keepValuesBriefly = false) {
      const date = dateInput.value || getTodayStr(0);
      const location = locationInput.value.trim();
      const item = itemInput.value.trim();
      const amount = parseInt(amountInput.value, 10);
      if (!location || !item || isNaN(amount) || amount <= 0) {
        showBanner('請填寫完整的「消費地點、消費項目、金額」後再存入。');
        return;
      }

      const editingId = editingIdInput.value;
      if (editingId) {
        records = records.map((r) => r.id === editingId ? { ...r, date, location, item, amount } : r);
        resetEditMode();
        showToast('已更新刷卡紀錄！');
      } else {
        records.unshift({ id: 'rec-' + Date.now(), date, location, item, amount });
        showToast('已新增刷卡紀錄！');
      }
      saveToStorage();
      renderRecords();

      if (!keepValuesBriefly) {
        locationInput.value = '';
        itemInput.value = '';
        amountInput.value = '';
      }
    }

    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      saveFormRecord(false);
    });

    function startEditRecord(id) {
      const target = records.find((r) => r.id === id);
      if (!target) return;
      switchTab('entry');
      editingIdInput.value = target.id;
      dateInput.value = target.date;
      locationInput.value = target.location;
      itemInput.value = target.item;
      amountInput.value = target.amount;
      flashElement(dateInput);
      flashElement(locationInput);
      flashElement(itemInput);
      flashElement(amountInput);
      submitBtn.textContent = '儲存修改';
      cancelEditBtn.classList.remove('hidden');
      showToast(`正在編輯：${target.location} (${formatCurrency(target.amount)})`);
    }

    function resetEditMode() {
      editingIdInput.value = '';
      submitBtn.textContent = '＋ 新增刷卡紀錄';
      cancelEditBtn.classList.add('hidden');
    }

    cancelEditBtn.addEventListener('click', () => {
      resetEditMode();
      locationInput.value = '';
      itemInput.value = '';
      amountInput.value = '';
      showToast('已取消編輯');
    });

    function deleteRecord(id) {
      const target = records.find((r) => r.id === id);
      records = records.filter((r) => r.id !== id);
      if (editingIdInput.value === id) resetEditMode();
      saveToStorage();
      renderRecords();
      if (target) showToast(`已刪除：${target.location} ${formatCurrency(target.amount)}`);
    }

    function formatCurrency(num) {
      return 'NT$ ' + Number(num || 0).toLocaleString('zh-TW');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderRecords() {
      const todayStr = getTodayStr(0);
      const todaySum = records.filter((r) => r.date === todayStr).reduce((acc, r) => acc + Number(r.amount || 0), 0);
      const totalSum = records.reduce((acc, r) => acc + Number(r.amount || 0), 0);

      todayTotalEl.textContent = formatCurrency(todaySum);
      grandTotalEl.textContent = formatCurrency(totalSum);
      totalCountEl.textContent = records.length;
      tabCountBadge.textContent = records.length;

      recentPreviewList.innerHTML = '';
      records.slice(0, 3).forEach((rec) => {
        const initial = (rec.location || '刷').trim().charAt(0);
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-3 py-2.5 px-3.5 rounded-2xl bg-[#FAF8F4] border border-[#E6E1D8] hover:border-[#D5CFC4] transition';
        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-xl bg-[#ECFDF5] text-[#0F766E] border border-[#A7F3D0]/80 flex items-center justify-center text-xs font-bold shrink-0">
              ${escapeHtml(initial)}
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-xs sm:text-sm font-bold text-[#1C1917] truncate">${escapeHtml(rec.location)}</span>
                <span class="font-num text-[11px] text-[#8A847C] shrink-0">${rec.date.slice(5)}</span>
              </div>
              <p class="text-xs text-[#57534E] truncate">${escapeHtml(rec.item)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2.5 shrink-0">
            <span class="font-num text-xs sm:text-sm font-bold text-[#1C1917]">${formatCurrency(rec.amount)}</span>
            <button type="button" data-edit="${rec.id}" class="text-xs font-medium text-[#0F766E] hover:underline cursor-pointer">編輯</button>
            <button type="button" data-del="${rec.id}" class="text-xs font-medium text-[#E11D48] hover:underline cursor-pointer">刪除</button>
          </div>
        `;
        recentPreviewList.appendChild(row);
      });

      recentPreviewList.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => startEditRecord(btn.getAttribute('data-edit')));
      });
      recentPreviewList.querySelectorAll('[data-del]').forEach((btn) => {
        btn.addEventListener('click', () => deleteRecord(btn.getAttribute('data-del')));
      });

      const filterDate = filterDateInput.value;
      const query = searchInput.value.trim().toLowerCase();
      clearFilterBtn.classList.toggle('hidden', !filterDate);

      const filtered = records
        .filter((r) => (!filterDate || r.date === filterDate))
        .filter((r) => !query || r.location.toLowerCase().includes(query) || r.item.toLowerCase().includes(query) || String(r.amount).includes(query))
        .sort((a, b) => b.date.localeCompare(a.date));

      recordsTableBody.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach((rec) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-[#FAF8F4] transition';
        tr.innerHTML = `
          <td class="py-2.5 px-3 whitespace-nowrap font-num text-[#8A847C]">${rec.date}</td>
          <td class="py-2.5 px-3 font-semibold text-[#1C1917]">${escapeHtml(rec.location)}</td>
          <td class="py-2.5 px-3 text-[#57534E]">${escapeHtml(rec.item)}</td>
          <td class="py-2.5 px-3 text-right font-num font-bold text-[#1C1917]">${formatCurrency(rec.amount)}</td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            <button type="button" data-edit="${rec.id}" class="text-[#0F766E] font-medium hover:underline mr-2.5 cursor-pointer">編輯</button>
            <button type="button" data-del="${rec.id}" class="text-[#E11D48] font-medium hover:underline cursor-pointer">刪除</button>
          </td>
        `;
        recordsTableBody.appendChild(tr);
      });

      recordsTableBody.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => startEditRecord(btn.getAttribute('data-edit')));
      });
      recordsTableBody.querySelectorAll('[data-del]').forEach((btn) => {
        btn.addEventListener('click', () => deleteRecord(btn.getAttribute('data-del')));
      });
    }

    filterDateInput.addEventListener('change', renderRecords);
    clearFilterBtn.addEventListener('click', () => { filterDateInput.value = ''; renderRecords(); });
    searchInput.addEventListener('input', renderRecords);

    function buildCsvString() {
      const headers = ['日期', '消費地點', '消費項目', '金額'];
      const rows = records.map((r) => [r.date, `"${r.location.replace(/"/g, '""')}"`, `"${r.item.replace(/"/g, '""')}"`, r.amount]);
      return [headers.join(','), ...rows.map((e) => e.join(','))].join('\n');
    }

    exportCsvBtn.addEventListener('click', () => {
      if (records.length === 0) {
        showBanner('目前尚無刷卡紀錄可匯出。');
        return;
      }
      const csvStr = buildCsvString();
      csvTextarea.value = csvStr;
      csvPreviewBox.classList.remove('hidden');

      try {
        const blob = new Blob(['\uFEFF' + csvStr], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `信用卡消費明細_${getTodayStr(0)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) {}
    });

    copyCsvBtn.addEventListener('click', () => {
      csvTextarea.select();
      try {
        navigator.clipboard.writeText(csvTextarea.value);
      } catch (e) {
        document.execCommand('copy');
      }
      copyCsvBtn.textContent = '✓ 已複製！';
      setTimeout(() => { copyCsvBtn.textContent = '複製 CSV'; }, 2000);
    });

    closeCsvBtn.addEventListener('click', () => {
      csvPreviewBox.classList.add('hidden');
    });

    renderRecords();
  </script>
</body>
</html>
